[package]
name = "proton-needle"
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Linux Wine/Proton DLL loader with a terminal interface"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
serde = "1"
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
rustix = { version = "1", features = ["fs", "event", "process"] }
unicode-segmentation = "1.13"
async-io = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
